# fly.toml app configuration file generated for if-dashboard-backend on 2026-09-10T18:15:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'if-dashboard-backend'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    port = 5000
    timeout = '5s'
    type = 'http'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
