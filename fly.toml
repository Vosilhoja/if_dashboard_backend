# fly.toml app configuration file generated for if-dashboard-backend on 2026-09-10T18:15:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'if-dashboard-backend'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
